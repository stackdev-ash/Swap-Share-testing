# Navigation
navbar.home=xpath://a[normalize-space()='Home']
navbar.inventory=xpath://a[normalize-space()='Inventory']
navbar.sell=xpath://a[normalize-space()='Sell/Donate']
navbar.myListings=xpath://a[normalize-space()='My Listings']
navbar.cart=xpath://a[@href='/cart']
navbar.login=xpath://a[normalize-space()='Login']
navbar.logout=xpath://button[normalize-space()='Logout']

# Home page
home.shopNow=xpath://a[normalize-space()='Shop Now']

# Login page
login.googleButton=xpath://button[contains(., 'Sign in with Google')]
login.email=id:email-address
login.password=id:password
login.rememberMe=id:remember-me
login.signIn=xpath://button[normalize-space()='Sign in']

# Shop page
shop.heading=xpath://h1[normalize-space()='Shop']
shop.productCards=xpath://div[.//button[normalize-space()='Add to Cart'] and .//h3]
shop.addToCart=xpath://button[normalize-space()='Add to Cart']
shop.viewCart=xpath://button[normalize-space()='View Cart']

# Cart page
cart.heading=xpath://h1[normalize-space()='Shopping Cart']
cart.itemNames=xpath://div[.//button[normalize-space()='Remove']]//h3

# Sell page
sell.heading=xpath://h2[normalize-space()='List Your Item for Sale']
sell.name=name:name
sell.description=name:description
sell.price=name:price
sell.originalPrice=name:original_price
sell.brand=name:brand
sell.size=name:size
sell.condition=name:condition
sell.category=name:category
sell.gender=name:gender
sell.ageGroup=name:age_group
sell.imageUrl=name:image_url
sell.submit=xpath://button[@type='submit' and normalize-space()='List Item']
